[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cticonnect"
dynamic = ["version"]
description = "CTIConnect: a benchmark for retrieval-augmented LLMs over heterogeneous Cyber Threat Intelligence"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Yutong Cheng" }
]
keywords = ["cyber threat intelligence", "benchmark", "LLM", "RAG", "retrieval-augmented generation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
baselines = [
    "openai>=1.0",
    "anthropic>=0.30",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "tqdm>=4.65",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[tool.setuptools.dynamic]
version = { attr = "cticonnect._version.__version__" }

[tool.setuptools.packages.find]
include = ["cticonnect*", "baselines*"]
exclude = ["construction*", "data*", "corpus_kb*", "corpus_reports*", "cskg*", "scripts*", "tests*", "docs*", "paper*"]

[tool.setuptools.package-data]
cticonnect = ["py.typed"]
